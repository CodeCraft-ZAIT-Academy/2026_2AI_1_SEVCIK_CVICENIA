<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
</head>
<body>
    <div style="display: flex; flex-direction: row;">
        <div style="background-color: greenyellow;">div1</div>
        <div style="background-color: rgb(234, 255, 47);">div2
            <p>This is paragraph</p>
        </div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;">
        <div style="background-color: greenyellow; width: 100px;">div1</div>
        <div style="background-color: rgb(234, 255, 47); flex: 1;">div2</div>
    </div>

    <div style="display: flex; flex-direction: row; margin-top: 30px;height: 70px;
    border-width: 1px; border-style: solid; border-color: grey; justify-content: space-between; align-items: center;">
        <div style="background-color: greenyellow; width: 100px;">div1</div>
        <div style="background-color: rgb(234, 255, 47); width: 500px;">div2</div>
        <div style="background-color: rgb(50, 47, 255); width: 100px;">div3</div>
    </div>

 
</body>
</html>
